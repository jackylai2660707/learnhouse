name: Web Lint
on:
  push:
    branches:
      - dev
    paths:
      - "apps/web/**"
      - "Dockerfile"
      - ".github/workflows/web-lint.yaml"
  pull_request:
    paths:
      - "apps/web/**"
      - "Dockerfile"
      - ".github/workflows/web-lint.yaml"
permissions:
  contents: read
jobs:
  next-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install dependencies
        run: bun install --frozen-lockfile
        working-directory: ./apps/web
      - name: Unit tests
        run: bun run test
        working-directory: ./apps/web
      - name: Typecheck
        run: bun run typecheck
        working-directory: ./apps/web
      - name: Production build
        run: bun run build
        working-directory: ./apps/web
      - name: Lint (advisory while existing baseline is paid down)
        continue-on-error: true
        run: bun run lint
        working-directory: ./apps/web
